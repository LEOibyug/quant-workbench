[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "quant-workbench"
version = "0.1.0"
description = "Local-first US equity strategy research workbench"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=19,<24",
  "duckdb>=1.2,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
quant-workbench = "quant_workbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/quant_workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
