[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "quant-workbench"
version = "0.2.0"
description = "Local-first US equity strategy research workbench"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "numpy>=2.2,<2.5",
  "pandas>=2.2,<3",
  "pyarrow>=19,<24",
  "duckdb>=1.2,<2",
  "exchange-calendars>=4.5,<5",
  "httpx[socks]>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "scikit-learn>=1.6,<2",
  "scipy>=1.15,<2",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
neural = ["torch>=2.6,<3"]

# 服务器 NVIDIA 驱动为 CUDA 12.4（550.54.14），PyPI 上 torch 2.6.0 的 Linux wheel
# 为 cu124 构建；更高版本的默认 wheel 需要 CUDA 13.0 驱动，无法初始化 GPU。
[tool.uv]
constraint-dependencies = ["torch==2.6.0"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
quant-workbench = "quant_workbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/quant_workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
